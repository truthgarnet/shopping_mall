server.port=9091

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/shopping_mall
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create

# --- 학습용 확인 설정 ---

# 1. 실행된 SQL 확인 (쿼리 횟수 세기)
# logging.level.org.hibernate.SQL=debug

# 2. 트랜잭션 시작/커밋/롤백 경계 확인
# logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug

# 3. 커넥션 풀 상태 확인 (total / active / idle / waiting)
# logging.level.com.zaxxer.hikari.pool.HikariPool=debug

# 3-1. 커넥션 풀 크기 - 기본값(10) 유지
#
# 측정 (2026-09-09) - 스레드 100 / 작업 1000 / 재고 1 / 비관적 락
#   pool  10 : 580~590ms  (변동 약 10ms)
#   pool  50 : 667~754ms  (변동 약 87ms)
#   pool 100 : 742ms      (1회 측정)
#   pool 150 : 694ms      (1회 측정)
#
# 락 경합 구간에서는 작은 풀이 더 빠르고 변동도 작았다.
# 커넥션을 늘려도 락 때문에 어차피 한 번에 하나씩만 처리되고,
# 대기 중인 트랜잭션이 많을수록 DB의 락 큐 관리 비용만 늘어난다.
# HikariCP 기본값이 10이므로 아래 줄은 주석으로 둔다.
#
# 자세한 내용: docs/journal/2026-09-09.md
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.connection-timeout=3000
